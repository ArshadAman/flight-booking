version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=flight_booking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flight_booking
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=django-insecure-mvp-flight-booking-key
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A flights_backend worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flight_booking
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  tunnel:
    image: cloudflare/cloudflared:latest
    entrypoint: ["cloudflared", "tunnel", "--no-autoupdate", "--url", "http://web:8000"]
    restart: always
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:




